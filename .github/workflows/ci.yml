name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run release gate
        id: release-gate
        run: npm run ci 2>&1 | tee .ci-release.log
      - name: Publish concise CI summary
        if: always()
        run: |
          {
            echo "## Jiraman release gate"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ steps.release-gate.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Sanitize failure diagnostics
        if: failure()
        run: |
          mkdir -p .ci-artifacts
          sed -E 's/(Authorization: (Basic|Bearer)|Cookie:|Set-Cookie:|password=|access_token=|refresh_token=|client_secret=)[^[:space:]]+/\1 [REDACTED]/Ig' .ci-release.log > .ci-artifacts/release-gate.log
      - name: Retain sanitized failure artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sanitized-ci-failure
          path: .ci-artifacts/release-gate.log
          retention-days: 7
