name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run release gate
        id: release-gate
        run: |
          trap 'rm -f .ci-release.raw.log' EXIT
          set +e
          npm run ci > .ci-release.raw.log 2>&1
          status=$?
          set -e
          ./scripts/sanitize_ci_log.sh .ci-release.raw.log .ci-release.log
          cat .ci-release.log
          exit "$status"
      - name: Publish concise CI summary
        if: always()
        run: |
          {
            echo "## Jiraman release gate"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Result: \`${{ steps.release-gate.outcome }}\`"
            if [[ -f .ci-release.log ]]; then
              invariant="$(awk '/^FAIL invariant=[A-Z][A-Z0-9_]*$/ { sub(/^FAIL invariant=/, ""); print; exit }' .ci-release.log)"
              if [[ -n "$invariant" ]]; then
                echo "- Invariant: \`$invariant\`"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare sanitized failure diagnostics
        if: failure()
        run: |
          mkdir -p .ci-artifacts
          cp .ci-release.log .ci-artifacts/release-gate.log
      - name: Retain sanitized failure artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sanitized-ci-failure
          path: .ci-artifacts/release-gate.log
          retention-days: 7
